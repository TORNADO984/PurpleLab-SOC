name: purplelab-soc

x-tool: &tool
  image: purplelab-soc:local
  build: .
  networks: [lab]
  volumes:
    - secrets:/state:ro
    - certs:/certs:ro
  environment:
    ELASTICSEARCH_URL: https://elasticsearch:9200
    KIBANA_URL: https://kibana:5601
    PURPLELAB_STATE: /state
    PURPLELAB_CA: /certs/ca/ca.crt
  read_only: true
  tmpfs: ["/tmp:size=32m,noexec,nosuid"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 100

services:
  secrets:
    <<: *tool
    user: "0:0"
    volumes: ["secrets:/state", "writer-secrets:/writer"]
    command: [init-secrets]
    restart: "no"

  certificates:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.6}
    user: "0:0"
    entrypoint: [bash, /bootstrap/certificates.sh]
    volumes:
      - certs:/certs
      - ca-private:/private
      - ./scripts/certificates.sh:/bootstrap/certificates.sh:ro
    networks: [lab]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 200
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.6}
    depends_on:
      secrets: {condition: service_completed_successfully}
      certificates: {condition: service_completed_successfully}
    environment:
      ELASTIC_PASSWORD_FILE: /state/elastic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./configs/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - certs:/usr/share/elasticsearch/config/certs:ro
      - secrets:/state:ro
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, 'curl --silent --fail --cacert config/certs/ca/ca.crt -u "elastic:$$(cat /state/elastic)" https://localhost:9200/_cluster/health?wait_for_status=yellow > /dev/null']
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 1000
    restart: unless-stopped

  security-setup:
    <<: *tool
    depends_on:
      elasticsearch: {condition: service_healthy}
    command: [setup-security]
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.6}
    depends_on:
      security-setup: {condition: service_completed_successfully}
    entrypoint: [bash, /bootstrap/kibana.sh]
    volumes:
      - ./scripts/kibana.sh:/bootstrap/kibana.sh:ro
      - ./configs/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - certs:/usr/share/kibana/config/certs:ro
      - secrets:/state:ro
      - kibana-data:/usr/share/kibana/data
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, 'curl --silent --fail --cacert config/certs/ca/ca.crt https://localhost:5601/api/status > /dev/null']
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 500
    restart: unless-stopped

  provision:
    <<: *tool
    depends_on:
      kibana: {condition: service_healthy}
    command: [provision]
    restart: "no"

  lab:
    <<: *tool
    profiles: [tools]
    depends_on:
      provision: {condition: service_completed_successfully}
    command: [--help]

  generator:
    <<: *tool
    profiles: [tools]
    volumes: ["writer-secrets:/state:ro", "certs:/certs:ro"]
    depends_on:
      provision: {condition: service_completed_successfully}
    command: [generate]

  gateway:
    image: nginx:1.28.3-alpine
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    depends_on:
      kibana: {condition: service_healthy}
    volumes: ["./configs/gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    networks: [edge, lab]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 5601 && nc -z 127.0.0.1 9200"]
      interval: 10s
      timeout: 5s
      retries: 6

  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION:-9.5.6}
    profiles: [filebeat]
    user: "0:0"
    entrypoint: [sh, -c]
    command: ['export BEATS_PASSWORD="$$(cat /state/beats_writer)"; exec filebeat -e --strict.perms=false']
    depends_on:
      provision: {condition: service_completed_successfully}
    volumes:
      - ./configs/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./artifacts/events:/events:ro
      - writer-secrets:/state:ro
      - certs:/certs:ro
      - filebeat-data:/usr/share/filebeat/data
    networks: [lab]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped
    healthcheck:
      test: [CMD, filebeat, test, config, --strict.perms=false]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  edge:
  lab:
    internal: true

volumes:
  es-data:
  kibana-data:
  secrets:
  writer-secrets:
  certs:
  ca-private:
  filebeat-data:
