name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q purplelab scripts tests
      - run: docker compose config --quiet
      - name: Generated content is reproducible
        run: |
          python scripts/build_content.py
          git diff --exit-code
      - name: Lint critical errors
        run: ruff check --select E9,F63,F7,F82 .
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dedicated CI host
        run: sudo sysctl -w vm.max_map_count=1048576
      - run: docker compose up -d --build
      - name: Require successful provisioning
        run: |
          container=$(docker compose ps -aq provision)
          code=$(docker wait "$container")
          test "$code" = 0
      - name: Validate real alerts
        run: |
          mkdir -p reports
          docker compose run --rm lab validate | tee reports/validation.json
      - name: Capture diagnostic logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-validation
          path: reports/
          retention-days: 7
      - name: Remove disposable CI lab
        if: always()
        run: docker compose --profile tools down --volumes --remove-orphans
