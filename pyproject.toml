[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "purplelab-soc"
version = "1.0.0"
description = "Controlled synthetic detection validation for Elastic Security"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["PyYAML==6.0.2", "ruff==0.11.13"]

[project.scripts]
purplelab = "purplelab.cli:main"

[tool.setuptools.packages.find]
include = ["purplelab*"]

[tool.ruff]
line-length = 110
target-version = "py311"
