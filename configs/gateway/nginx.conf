# TLS passthrough to two fixed destinations. No HTTP CONNECT or forward proxy.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
stream {
    server {
        listen 5601;
        proxy_pass kibana:5601;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
    }
    server {
        listen 9200;
        proxy_pass elasticsearch:9200;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
    }
}
