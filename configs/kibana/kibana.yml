server.name: purplelab-soc
server.host: 0.0.0.0
server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana/kibana.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana/kibana.key
elasticsearch.hosts: [https://elasticsearch:9200]
elasticsearch.username: kibana_system
elasticsearch.password: ${KIBANA_PASSWORD}
elasticsearch.ssl.certificateAuthorities: [/usr/share/kibana/config/certs/ca/ca.crt]
xpack.encryptedSavedObjects.encryptionKey: ${SAVED_OBJECTS_KEY}
xpack.security.encryptionKey: ${SESSION_KEY}
xpack.reporting.encryptionKey: ${REPORTING_KEY}
xpack.security.secureCookies: true
telemetry.enabled: false
telemetry.optIn: false
newsfeed.enabled: false
xpack.fleet.isAirGapped: true
uiSettings.overrides:
  defaultIndex: purplelab-events
  "securitySolution:defaultIndex": [purplelab-events-*]
  "dateFormat:tz": UTC
