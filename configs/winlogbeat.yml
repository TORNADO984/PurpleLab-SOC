# Run only on an authorized, isolated Windows VM; use the tunnel in docs/windows-vm.md.
winlogbeat.event_logs:
  - name: Microsoft-Windows-Sysmon/Operational
    event_id: 1, 3, 10, 11, 13, 22
  - name: Security
    event_id: 4624, 4698, 1102
  - name: System
    event_id: 7045
setup.ilm.enabled: false
setup.template.enabled: false
output.elasticsearch:
  hosts: ["https://localhost:19200"]
  username: beats_writer
  password: "${BEATS_PASSWORD}"
  ssl.certificate_authorities: ["C:/Program Files/Winlogbeat/ca.crt"]
  index: "purplelab-events-%{+yyyy.MM.dd}"
  pipeline: purplelab-windows
processors:
  - add_host_metadata: ~
  - add_fields:
      target: purplelab
      fields:
        synthetic: false
logging.level: info
