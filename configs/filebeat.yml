# Optional ECS NDJSON shipper; see docs/usage.md.
filebeat.inputs:
  - type: filestream
    id: purplelab-json
    paths: [/events/*.ndjson]
    prospector.scanner.fingerprint.length: 64
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: true
setup.ilm.enabled: false
setup.template.enabled: false
output.elasticsearch:
  hosts: ["https://elasticsearch:9200"]
  username: beats_writer
  password: "${BEATS_PASSWORD}"
  ssl.certificate_authorities: [/certs/ca/ca.crt]
  index: "purplelab-events-%{+yyyy.MM.dd}"
  pipeline: purplelab-windows
