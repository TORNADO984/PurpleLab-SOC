id: discovery
name: Build a reconnaissance timeline
description: A lab account runs identity, account, system and network enumeration
  commands. Practice combining weak signals without treating routine administration
  as an incident.
techniques:
- T1018
- T1033
- T1082
- T1087.001
authorized_use_only: true
generate: docker compose run --rm lab generate --scenario discovery
validate: docker compose run --rm lab validate --scenario discovery
expected_rules:
- 1e155ba5-f9ff-5d3d-b5d9-95dae6612564
- b153aa43-4a8d-54dc-a2f7-3152a53300e1
- b175bb3a-dde4-5c39-866c-d8458e3a2ea4
- d434ac0c-2ed4-55ef-bb88-8a25e6fbba27
playbook:
- Collect the four discovery alerts and record the exact command lines and process
  names.
- Order the events by UTC timestamp. The synthetic fixtures share a host/user, but
  do not prove a common parent process.
- 'Explain what each command reveals: identity privileges, local accounts, OS details
  and reachable systems.'
- Compare the user and schedule to helpdesk or asset-management jobs. Request the
  originating logon and parent process tree.
- Pivot to execution, credential access and remote logon evidence around the same
  time. Record whether the broader chain exists.
- Write a low-confidence disposition when corroboration is absent; propose narrow
  exclusions using approved process ancestry rather than blanket tool exclusions.
false_positives:
- Helpdesk scripts often collect identity and group membership; this is a low-confidence
  behavioral signal.
- Inventory and support tasks enumerate users; correlate with the operator's change
  window.
- Asset inventory routinely collects operating system information; inspect parent
  process and surrounding events.
- Administrators use net view to diagnose browsing; compare source host and account
  to normal support activity.
queries:
- 'purplelab.scenario: "discovery"'
- 'process.name: ("whoami.exe" OR "net.exe" OR "systeminfo.exe")'
disposition: Escalate only when context or a broader chain supports unauthorized reconnaissance.
