id: credential-access
name: Triage credential access indicators
description: A diagnostic process requests extensive LSASS access while reg.exe exports
  the SAM hive. Determine whether this is approved forensic collection.
techniques:
- T1003.001
- T1003.002
authorized_use_only: true
generate: docker compose run --rm lab generate --scenario credential-access
validate: docker compose run --rm lab validate --scenario credential-access
expected_rules:
- 386c5daa-b277-5844-a68d-60c199980ce4
- 7f86ae50-a0d9-5a79-9a62-7dc8b20267f5
playbook:
- Review Sysmon event 10 and copy SourceImage/TargetImage (or mapped process.executable)
  and GrantedAccess into the case record.
- Confirm the target is lsass.exe and the mask is 0x1fffff. A handle request alone
  does not establish that credentials were extracted.
- Search the same host for reg.exe and SAM export. Record destination paths without
  opening any potentially sensitive output.
- Check the actor's authorization, process signing evidence and forensic collection
  ticket. The fixture omits signing evidence deliberately.
- Request process tree, file creation and SYSTEM hive access evidence for a real case;
  list these as unknown if not available.
- For a confirmed unauthorized real action, escalate to the incident lead for isolation
  and credential rotation under the approved response procedure.
false_positives:
- EDR and approved diagnostic tools may access LSASS; corroborate signature, owner
  and access mask.
- Authorized forensic acquisition may export hives; require a case number and explicit
  host approval.
queries:
- 'purplelab.scenario: "credential-access"'
- 'event.code: ("10" OR "1")'
disposition: High severity if unapproved access is corroborated; do not claim that
  password dumping succeeded from these events alone.
